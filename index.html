<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Actually Went Wrong? — Incident Review</title>
<style>
/* ======================================================================
   DESIGN TOKENS
   ====================================================================== */
:root{
  --navy:#14143A;
  --navy-2:#1E1E52;
  --ink:#201F33;
  --ink-soft:#514F68;
  --paper:#F5F0E4;
  --paper-2:#FFFFFF;
  --line:#DED2B6;
  --line-soft:#E9E0CC;
  --coral:#C1472E;
  --coral-text:#A83D26;
  --coral-tint:#FBECE8;
  --teal:#1C7F73;
  --teal-tint:#E9F4F2;
  --mustard:#AD7A16;
  --mustard-tint:#FBF1DD;
  --mark:rgba(244,178,24,.45);
  --focus:#2B5FE2;
  --shadow-sm:0 2px 8px rgba(20,20,58,.07);
  --shadow-md:0 10px 28px rgba(20,20,58,.11);
  --shadow-lg:0 20px 48px rgba(20,20,58,.16);
  --radius-card:14px;
  --radius-chip:9px;
  --font-serif:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-ar:'Segoe UI','Tahoma','Geeza Pro','Arial',sans-serif;
  --dur-micro:200ms;
  --dur-panel:480ms;
  --ease:cubic-bezier(.25,.7,.35,1);
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-sans);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body.lang-ar{font-family:var(--font-ar);}
h1,h2,h3{font-family:var(--font-serif);margin:0;color:var(--navy);font-weight:700;}
body.lang-ar h1, body.lang-ar h2, body.lang-ar h3{font-family:var(--font-ar);font-weight:700;}
p{margin:0;}
button{font-family:inherit;font-size:inherit;color:inherit;}
img,svg{display:block;}
.visually-hidden{
  position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* Focus states */
a:focus-visible, button:focus-visible, [tabindex]:focus-visible, [role="radio"]:focus-visible{
  outline:2px solid var(--focus);
  outline-offset:2px;
  border-radius:4px;
}
a:focus:not(:focus-visible), button:focus:not(:focus-visible){outline:none;}

/* ======================================================================
   LAYOUT SHELL
   ====================================================================== */
#root{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;gap:1.25rem;
  padding:.9rem 2rem;
  background:var(--paper-2);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex;align-items:center;gap:.85rem;min-width:0;}
.brand-logo{flex:0 0 auto;height:28px;width:auto;}
.brand-logo svg{height:28px;width:auto;display:block;}
.brand-kicker{
  font-size:.8rem;color:var(--ink-soft);
  border-inline-start:1px solid var(--line);
  padding-inline-start:.85rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar-actions{margin-inline-start:auto;display:flex;align-items:center;gap:1rem;flex:0 0 auto;}
.lang-switch{
  display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
}
.lang-switch button{
  border:none;background:transparent;padding:.4rem .85rem;cursor:pointer;
  font-size:.85rem;color:var(--ink-soft);transition:background var(--dur-micro) ease,color var(--dur-micro) ease;
}
.lang-switch button[aria-pressed="true"]{background:var(--navy);color:#fff;}
.reset-link{
  border:none;background:none;cursor:pointer;font-size:.85rem;color:var(--ink-soft);
  text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;
  padding:.2rem 0;
}
.reset-link:hover{color:var(--ink);text-decoration-color:var(--ink-soft);}
.storage-note{
  font-size:.72rem;color:var(--coral-text);background:var(--coral-tint);
  padding:.25rem .6rem;border-radius:999px;
}

.hero{padding:1.4rem 2rem .6rem;max-width:1280px;margin:0 auto;width:100%;}
.hero h1{font-size:2.1rem;letter-spacing:-.01em;}
.hero .hero-sub{margin-top:.35rem;font-size:1rem;color:var(--ink-soft);}
.hero .hero-help{margin-top:.6rem;font-size:.92rem;color:var(--ink-soft);max-width:62ch;}

main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:0 2rem 2.5rem;display:flex;flex-direction:column;}

/* Case tabs */
.case-tabs{
  display:flex;gap:.4rem;margin:1.1rem 0 1.4rem;padding-bottom:0;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
}
.case-tab{
  border:1px solid var(--line);border-bottom:none;
  background:var(--paper-2);
  padding:.5rem .95rem .6rem;
  border-radius:8px 8px 0 0;
  font-size:.85rem;color:var(--ink-soft);
  cursor:default;white-space:nowrap;
  transform:translateY(1px);
  transition:transform var(--dur-micro) var(--ease),background var(--dur-micro) ease;
  display:flex;align-items:center;gap:.4rem;
}
.case-tab .num{
  width:1.3rem;height:1.3rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:.72rem;background:var(--line-soft);color:var(--ink-soft);flex:0 0 auto;
}
.case-tab.active{
  background:var(--paper);color:var(--navy);font-weight:600;
  transform:translateY(2px);border-color:var(--line);
}
.case-tab.active .num{background:var(--navy);color:#fff;}
.case-tab.done .num{background:var(--teal);color:#fff;}
.case-tab.done{cursor:pointer;}
.case-tab.done:hover{background:var(--paper);}
.case-tab.locked{opacity:.45;}

/* ======================================================================
   INCIDENT VIEW — two column
   ====================================================================== */
.incident-grid{
  display:grid;grid-template-columns:1.28fr 1fr;gap:1.75rem;align-items:start;
}
@media (max-width: 880px){
  .incident-grid{grid-template-columns:1fr;}
}

/* Case sheet (left) */
.case-sheet{
  position:relative;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:4px;
  box-shadow:var(--shadow-md);
  padding:2.1rem 2rem 1.9rem;
  transform:rotate(-.35deg);
  animation:sheetIn var(--dur-panel) var(--ease);
}
@keyframes sheetIn{
  from{opacity:0;transform:rotate(-.35deg) translateY(10px);}
  to{opacity:1;transform:rotate(-.35deg) translateY(0);}
}
.case-clip{position:absolute;top:-14px;inset-inline-end:34px;width:34px;height:46px;opacity:.85;}
.case-tag{
  display:inline-block;
  font-family:var(--font-serif);
  font-style:italic;
  font-size:1rem;
  background:var(--paper);
  border:1px solid var(--line);
  padding:.45rem .9rem;
  border-radius:3px;
  transform:rotate(-1.4deg);
  box-shadow:0 3px 6px rgba(20,20,58,.08);
  color:var(--navy);
  margin-bottom:1.1rem;
}
body.lang-ar .case-tag{font-style:normal;font-weight:600;}
.case-number{
  font-size:.78rem;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:.35rem;
}
.case-scenario{
  font-size:1.18rem;line-height:1.68;color:var(--ink);
  max-width:56ch;
}
.case-scenario .ev{
  all:unset;cursor:pointer;display:inline;
  padding:0 .05em;border-radius:2px;
  border-bottom:1.5px dashed rgba(32,31,51,.38);
  transition:background-color var(--dur-micro) ease, border-color var(--dur-micro) ease;
}
.case-scenario .ev:hover, .case-scenario .ev:focus-visible{
  border-color:var(--ink);background-color:rgba(32,31,51,.06);
}
.case-scenario .ev[aria-pressed="true"]{
  border-color:transparent;
  background-image:linear-gradient(to bottom, transparent 58%, var(--mark) 58%);
}
.case-scenario mark{
  background-image:linear-gradient(to bottom, transparent 58%, var(--mark) 58%);
  background-color:transparent;color:inherit;padding:0 .05em;border-radius:2px;
}
.case-scenario .ev-plain{color:inherit;}
.case-atmosphere{
  margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line-soft);
  font-size:.85rem;color:var(--ink-soft);display:flex;align-items:center;gap:.5rem;
  transition:opacity var(--dur-panel) ease;
}
.case-atmosphere .dot{width:.5rem;height:.5rem;border-radius:50%;flex:0 0 auto;}

/* mode atmosphere tints */
.case-sheet.mode-think{background:#FBF8F1;}
.case-sheet.mode-discuss{background:#FCF6EC;}
.case-sheet.mode-verdict{background:var(--paper-2);}
.case-sheet.mode-evidence{background:var(--paper-2);}
.case-sheet.mode-locked{background:#F8F6F0;}

/* Right panel */
.panel{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-sm);
  padding:1.6rem 1.7rem 1.7rem;
  min-height:420px;
  display:flex;flex-direction:column;
  animation:panelIn var(--dur-panel) var(--ease);
}
@keyframes panelIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.panel-kicker{font-size:.78rem;color:var(--ink-soft);margin-bottom:.3rem;}
.panel h2{font-size:1.35rem;margin-bottom:.4rem;}
.panel-instruction{color:var(--ink-soft);font-size:.94rem;margin-bottom:1.1rem;}

/* timer */
.timer{margin:.2rem 0 1.2rem;}
.timer-track{height:4px;background:var(--line-soft);border-radius:99px;overflow:hidden;}
.timer-fill{height:100%;background:var(--teal);border-radius:99px;transform-origin:left center;transition:transform 260ms linear;}
body.lang-ar .timer-fill{transform-origin:right center;}
.timer-label{font-size:.76rem;color:var(--ink-soft);margin-top:.4rem;}

/* discussion prompts */
.prompt-list{list-style:none;margin:0 0 1.3rem;padding:0;display:flex;flex-direction:column;gap:.65rem;}
.prompt-list li{
  display:flex;gap:.6rem;align-items:flex-start;font-size:.98rem;color:var(--ink);
  background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:.7rem .85rem;
}
.prompt-list li .qmark{
  flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.85rem;font-family:var(--font-serif);
}

/* Lens grid */
.lens-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;margin-bottom:1rem;}
@media (max-width: 620px){.lens-grid{grid-template-columns:1fr;}}
.lens-card{
  text-align:start;border:1.5px solid var(--line);background:var(--paper-2);
  border-radius:12px;padding:.9rem .8rem;cursor:pointer;
  display:flex;flex-direction:column;gap:.55rem;
  transition:transform var(--dur-micro) var(--ease), box-shadow var(--dur-micro) ease, border-color var(--dur-micro) ease, background var(--dur-micro) ease;
}
.lens-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}
.lens-card .lens-icon{
  width:2.2rem;height:2.2rem;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;
}
.lens-card[data-lens="ethics"] .lens-icon{background:var(--coral);}
.lens-card[data-lens="manners"] .lens-icon{background:var(--teal);}
.lens-card[data-lens="etiquette"] .lens-icon{background:var(--mustard);}
.lens-card .lens-label{font-size:.92rem;font-weight:600;color:var(--navy);line-height:1.3;}
.lens-card[aria-checked="true"][data-lens="ethics"]{border-color:var(--coral);background:var(--coral-tint);}
.lens-card[aria-checked="true"][data-lens="manners"]{border-color:var(--teal);background:var(--teal-tint);}
.lens-card[aria-checked="true"][data-lens="etiquette"]{border-color:var(--mustard);background:var(--mustard-tint);}

.secondary-row{
  margin:.2rem 0 1rem;padding:.85rem .9rem;background:var(--paper);border:1px dashed var(--line);border-radius:10px;
}
.secondary-row .sec-label{font-size:.82rem;color:var(--ink-soft);margin-bottom:.55rem;}
.chip-row{display:flex;gap:.5rem;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:.4rem .85rem;
  font-size:.82rem;cursor:pointer;color:var(--ink);transition:all var(--dur-micro) ease;
}
.chip[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:#fff;}

/* evidence selection readback */
.evidence-picked{list-style:none;margin:0 0 1rem;padding:0;display:flex;flex-direction:column;gap:.5rem;min-height:2.2rem;}
.evidence-picked li{
  display:flex;align-items:center;gap:.5rem;background:var(--paper);border:1px solid var(--line-soft);
  border-radius:8px;padding:.45rem .7rem;font-size:.88rem;
}
.evidence-picked li .rm{
  margin-inline-start:auto;border:none;background:none;cursor:pointer;color:var(--ink-soft);
  width:1.4rem;height:1.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.evidence-picked li .rm:hover{background:var(--line-soft);color:var(--ink);}
.evidence-empty{font-size:.85rem;color:var(--ink-soft);font-style:italic;}
body.lang-ar .evidence-empty{font-style:normal;}

.validation-msg{
  font-size:.85rem;color:var(--coral-text);background:var(--coral-tint);border-radius:8px;
  padding:.55rem .75rem;margin-bottom:.9rem;
}

.panel-footer{margin-top:auto;display:flex;justify-content:flex-end;gap:.6rem;padding-top:.6rem;}

/* Buttons */
.btn{
  border:none;border-radius:9px;padding:.72rem 1.3rem;font-size:.95rem;font-weight:600;cursor:pointer;
  transition:transform var(--dur-micro) var(--ease), box-shadow var(--dur-micro) ease, background var(--dur-micro) ease;
}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);box-shadow:var(--shadow-sm);}
.btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--paper);}
.btn:active{transform:scale(.98);}

/* Locked / decision recap */
.decision-card{
  border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.15rem;background:var(--paper);
  animation:lockIn var(--dur-panel) var(--ease);
}
@keyframes lockIn{
  from{opacity:0;transform:translateY(10px) scale(.98);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.decision-lens-tag{
  display:inline-flex;align-items:center;gap:.5rem;font-weight:600;color:var(--navy);
  background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;font-size:.85rem;
  margin-bottom:.7rem;
}
.decision-lens-tag .dot{width:.6rem;height:.6rem;border-radius:50%;}
.decision-evidence{font-size:.9rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:.35rem;margin-bottom:.8rem;}
.decision-note{font-size:.88rem;color:var(--ink-soft);border-top:1px solid var(--line-soft);padding-top:.7rem;}

/* ======================================================================
   CENTERED SCREENS (home / pause / reveal / review)
   ====================================================================== */
.screen-center{display:flex;flex-direction:column;align-items:center;padding:1.2rem 0 2rem;}
.screen-card{
  max-width:760px;width:100%;background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--radius-card);box-shadow:var(--shadow-md);padding:2.4rem 2.4rem 2.2rem;
  animation:panelIn var(--dur-panel) var(--ease);
}
.screen-card h2{font-size:1.6rem;margin-bottom:.8rem;}
.screen-card p{color:var(--ink-soft);font-size:1.02rem;line-height:1.65;}
.screen-card p + p{margin-top:.7rem;}
.screen-actions{margin-top:1.6rem;display:flex;gap:.8rem;flex-wrap:wrap;}
.home-note{
  margin-top:1.4rem;padding:.9rem 1rem;background:var(--paper);border-radius:10px;
  border:1px solid var(--line-soft);font-size:.88rem;color:var(--ink-soft);display:flex;gap:.65rem;
}

.afterlearning-block{
  margin-top:1.8rem;padding:1.3rem 1.4rem;border:1.5px dashed var(--line);border-radius:12px;background:var(--paper);
}
.afterlearning-block .al-label{
  font-size:.78rem;letter-spacing:.02em;color:var(--mustard);font-weight:700;margin-bottom:.5rem;
}
.afterlearning-block p{color:var(--ink);font-size:.95rem;}

/* Reveal morph cards */
.reveal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.6rem 0 1.2rem;}
@media (max-width: 680px){.reveal-grid{grid-template-columns:1fr;}}
.morph-card{perspective:1200px;height:150px;}
.morph-inner{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform 700ms var(--ease);
}
.morph-card.flipped .morph-inner{transform:rotateY(180deg);}
.morph-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.5rem;
  padding:1.1rem 1.05rem;border:1.5px solid var(--line);
}
.morph-face.front{background:var(--paper-2);}
.morph-face.back{transform:rotateY(180deg);color:#fff;}
.morph-face .lens-icon{width:2rem;height:2rem;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;}
.morph-card[data-lens="ethics"] .front .lens-icon{background:var(--coral);}
.morph-card[data-lens="manners"] .front .lens-icon{background:var(--teal);}
.morph-card[data-lens="etiquette"] .front .lens-icon{background:var(--mustard);}
.morph-card[data-lens="ethics"] .back{background:var(--coral);}
.morph-card[data-lens="manners"] .back{background:var(--teal);}
.morph-card[data-lens="etiquette"] .back{background:var(--mustard);}
.morph-face .face-label{font-weight:600;font-size:.98rem;line-height:1.3;color:var(--navy);}
.morph-face.back .face-label{color:#fff;font-family:var(--font-serif);font-size:1.35rem;}
body.lang-ar .morph-face.back .face-label{font-family:var(--font-ar);}
.morph-face.back .face-icon-only{opacity:.85;}

.reveal-sub{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.3rem;
  opacity:0;transition:opacity var(--dur-panel) ease;
}
.reveal-sub.show{opacity:1;}
@media (max-width: 680px){.reveal-sub{grid-template-columns:1fr;}}
.reveal-sub div{font-size:.85rem;color:var(--ink-soft);padding:0 .2rem;}

.reveal-quote{
  font-family:var(--font-serif);font-style:italic;font-size:1.2rem;color:var(--navy);
  text-align:center;max-width:52ch;margin:.4rem auto 0;line-height:1.5;
  opacity:0;transition:opacity 600ms ease;
}
body.lang-ar .reveal-quote{font-style:normal;}
.reveal-quote.show{opacity:1;}
.reveal-cta{display:flex;justify-content:center;margin-top:1.6rem;opacity:0;transition:opacity 500ms ease;}
.reveal-cta.show{opacity:1;}

/* Review list */
.review-list{display:flex;flex-direction:column;gap:.9rem;margin-top:1.6rem;}
.review-card{
  border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;background:var(--paper-2);
}
.review-card-top{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;}
.review-tag{font-family:var(--font-serif);font-style:italic;color:var(--navy);font-size:1rem;}
body.lang-ar .review-tag{font-style:normal;font-weight:600;}
.review-lens-chip{
  margin-inline-start:auto;display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;
  padding:.3rem .7rem;border-radius:999px;color:#fff;
}
.review-lens-chip.ethics{background:var(--coral);}
.review-lens-chip.manners{background:var(--teal);}
.review-lens-chip.etiquette{background:var(--mustard);}
.review-recap{font-size:.92rem;color:var(--ink-soft);margin-top:.6rem;line-height:1.55;}
.review-status{font-size:.8rem;color:var(--teal);margin-top:.5rem;font-weight:600;}
.review-actions{display:flex;gap:.6rem;margin-top:.85rem;}
.review-edit{
  margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line-soft);
}

/* Case scenario reused inside review edit (smaller) */
.review-scenario{font-size:1.02rem;line-height:1.6;margin-bottom:.9rem;}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,20,58,.4);display:flex;align-items:center;justify-content:center;
  padding:1.5rem;z-index:50;
}
.modal{
  max-width:420px;width:100%;background:var(--paper-2);border-radius:14px;box-shadow:var(--shadow-lg);
  padding:1.6rem 1.7rem;
}
.modal h3{font-size:1.15rem;margin-bottom:.6rem;}
.modal p{color:var(--ink-soft);font-size:.94rem;}
.modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.3rem;}

/* icon svg baseline */
.icon{width:1.1rem;height:1.1rem;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.icon-lg{width:1.3rem;height:1.3rem;}

@media (max-width:720px){
  .topbar{padding:.8rem 1.1rem;flex-wrap:wrap;row-gap:.6rem;}
  .hero,main{padding-left:1.1rem;padding-right:1.1rem;}
  .screen-card{padding:1.6rem 1.4rem;}
}
</style>
</head>
<body>

<script>

   ====================================================================== */
function freshIncidentState(){
  return {phase:"think", primary:null, secondary:null, evidence:[], locked:false, reviewDecision:null, reviewEditing:false};
}
function freshState(){
  var incidents = {};
  INCIDENTS.forEach(function(inc){ incidents[inc.id] = freshIncidentState(); });
  return {
    version:1,
    lang:"en",
    view:"home", /* home | incident | pause | reveal | review */
    currentIndex:0,
    incidents:incidents,
    part1Complete:false,
    afterLearningUnlocked:false
  };
}
function loadState(){
  try{
    var raw = storage.get(STORAGE_KEY);
    if(!raw) return freshState();
    var parsed = JSON.parse(raw);
    if(!parsed || parsed.version !== 1) return freshState();
    return parsed;
  }catch(e){
    return freshState();
  }
}
function saveState(){
  try{ storage.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}

function scenarioHTML(inc, lang, incState, interactive){
  var segs = inc.scenario[lang];
  var selected = incState.evidence;
  return segs.map(function(seg){
    if(seg[0]==="t"){ return seg[1]; }
    var id = seg[1], text = seg[2];
    var isSel = selected.indexOf(id) !== -1;
    if(interactive){
      return '<button type="button" class="ev" data-action="toggle-evidence" data-ev="'+id+'" data-inc="'+inc.id+'" aria-pressed="'+(isSel?"true":"false")+'">'+text+'</button>';
    }
    if(isSel){
      return '<mark>'+text+'</mark>';
    }
    return '<span class="ev-plain">'+text+'</span>';
  }).join("");
}

function lensIconChip(lensId){
  return '<span class="lens-icon" data-lens="'+lensId+'">'+LENS[lensId].icon+'</span>';
}

function atmosphereDot(phase){
  var colorMap = {think:"#9B8F6B", discuss:"#C1472E", verdict:"#1C7F73", evidence:"#AD7A16", locked:"#1C7F73"};
  return colorMap[phase] || "#9B8F6B";
}

function frontierIndex(){
  for(var i=0;i<INCIDENTS.length;i++){
    if(!state.incidents[INCIDENTS[i].id].locked) return i;
  }
  return INCIDENTS.length;
}

function renderCaseTabs(){
  var L = state.lang;
  var html = '<nav class="case-tabs" role="tablist" aria-label="Incidents">';
  INCIDENTS.forEach(function(inc, idx){
    var incState = state.incidents[inc.id];
    var isActive = (idx === state.currentIndex && state.view === "incident");
    var isLocked = incState.locked;
    var cls = "case-tab";
    if(isActive) cls += " active";
    if(isLocked) cls += " done";
    if(!isActive && !isLocked) cls += " locked";
    var clickable = isLocked && !isActive;
    html += '<button type="button" class="'+cls+'" role="tab" '+
            (clickable ? 'data-action="goto-incident" data-idx="'+idx+'"' : 'disabled aria-disabled="true"')+
            ' aria-selected="'+(idx===state.currentIndex?"true":"false")+'">'+
            '<span class="num">'+(isLocked ? ICONS.check.replace('class="icon"','style="width:.7rem;height:.7rem;stroke:#fff;"') : inc.num)+'</span>'+
            '<span>'+inc.tag[L]+'</span>'+
            '</button>';
  });
  html += '</nav>';
  return html;
}

   ====================================================================== */
function ensureTimer(incId, phase, durationMs){
  var rt = timerRuntime[incId];
  if(!rt || rt.phase !== phase){
    timerRuntime[incId] = {phase:phase, startedAt:Date.now(), duration:durationMs};
  }
}
function timerRemainingRatio(incId){
  var rt = timerRuntime[incId];
  if(!rt) return 0;
  var elapsed = Date.now() - rt.startedAt;
  var ratio = 1 - (elapsed / rt.duration);
  if(ratio < 0) ratio = 0;
  return ratio;
}
function timerDone(incId){
  var rt = timerRuntime[incId];
  if(!rt) return true;
  return (Date.now() - rt.startedAt) >= rt.duration;
}

function renderIncidentView(){
  var L = state.lang;
  var inc = currentIncident();
  var incState = state.incidents[inc.id];
  var phase = incState.phase;

  var sheetMode = "mode-" + phase;
  var scenarioInteractive = (phase === "evidence");
  var scenario = scenarioHTML(inc, L, incState, scenarioInteractive);

  var atmosphereText = {
    think:t("thinkHeading",L), discuss:t("discussHeading",L),
    verdict:t("verdictKicker",L), evidence:t("evidenceKicker",L), locked:t("lockedKicker",L)
  }[phase];

  var caseSheet = ''+
  '<div class="case-sheet '+sheetMode+'">'+
    '<span class="case-clip">'+ICONS.clip+'</span>'+
    '<div class="case-number">'+(L==="ar" ? ("حالة " + inc.num + " من 5") : ("Incident " + inc.num + " of 5"))+'</div>'+
    '<div class="case-tag">'+inc.tag[L]+'</div>'+
    '<p class="case-scenario">'+scenario+'</p>'+
    '<div class="case-atmosphere"><span class="dot" style="background:'+atmosphereDot(phase)+'"></span><span>'+atmosphereText+'</span></div>'+
  '</div>';

  var panel = "";
  if(phase === "think"){
    ensureTimer(inc.id, "think", 15000);
    panel = renderThinkPanel(L, inc);
  } else if(phase === "discuss"){
    ensureTimer(inc.id, "discuss", 45000);
    panel = renderDiscussPanel(L, inc);
  } else if(phase === "verdict"){
    panel = renderVerdictPanel(L, inc, incState);
  } else if(phase === "evidence"){
    panel = renderEvidencePanel(L, inc, incState);
  } else if(phase === "locked"){
    panel = renderLockedPanel(L, inc, incState);
  }

  return ''+
  renderCaseTabs()+
  '<div class="incident-grid">'+
    caseSheet+
    panel+
  '</div>';
}

function renderTimerBar(incId, label){
  var ratio = timerRemainingRatio(incId);
  var pct = Math.round(ratio*100);
  var done = timerDone(incId);
  return ''+
  '<div class="timer" data-timer-for="'+incId+'">'+
    '<div class="timer-track"><div class="timer-fill" style="transform:scaleX('+(pct/100)+')"></div></div>'+
    '<div class="timer-label">'+(done ? t("timerReady", state.lang) : label)+'</div>'+
  '</div>';
}

function renderVerdictPanel(L, inc, incState){
  var lensCards = LENS_ORDER.map(function(id){
    var checked = incState.primary === id;
    return '<button type="button" class="lens-card" role="radio" aria-checked="'+(checked?"true":"false")+'" data-lens="'+id+'" data-action="choose-primary" data-lens-id="'+id+'">'+
      lensIconChip(id)+
      '<span class="lens-label">'+LENS[id].phase1[L]+'</span>'+
      '</button>';
  }).join("");

  var secondaryHTML = "";
  if(incState.primary){
    var remaining = LENS_ORDER.filter(function(id){return id !== incState.primary;});
    var chips = remaining.map(function(id){
      var checked = incState.secondary === id;
      return '<button type="button" class="chip" role="radio" aria-checked="'+(checked?"true":"false")+'" data-action="choose-secondary" data-lens-id="'+id+'">'+LENS[id].phase1[L]+'</button>';
    }).join("");
    var noneChecked = (incState.secondary === null || incState.secondary === "none");
    chips += '<button type="button" class="chip" role="radio" aria-checked="'+(noneChecked?"true":"false")+'" data-action="choose-secondary" data-lens-id="none">'+t("secondaryNone",L)+'</button>';
    secondaryHTML = ''+
    '<div class="secondary-row" role="radiogroup" aria-label="'+t("secondaryLabel",L)+'">'+
      '<p class="sec-label">'+t("secondaryLabel",L)+'</p>'+
      '<div class="chip-row">'+chips+'</div>'+
    '</div>';
  }

  var err = validation[inc.id] === "verdict" ? '<p class="validation-msg" role="alert">'+t("errChooseVerdict",L)+'</p>' : "";

  return ''+
  '<div class="panel">'+
    '<p class="panel-kicker">'+t("verdictKicker",L)+'</p>'+
    '<h2>'+t("verdictHeading",L)+'</h2>'+
    '<p class="panel-instruction">'+t("verdictInstruction",L)+'</p>'+
    '<div class="lens-grid" role="radiogroup" aria-label="'+t("verdictHeading",L)+'">'+lensCards+'</div>'+
    secondaryHTML+
    err+
    '<div class="panel-footer">'+
      '<button type="button" class="btn btn-primary" data-action="advance-phase" data-to="evidence">'+t("continueToEvidence",L)+'</button>'+
    '</div>'+
  '</div>';
}

function renderEvidencePanel(L, inc, incState){
  var pickedHTML = "";
  if(incState.evidence.length === 0){
    pickedHTML = '<p class="evidence-empty">'+t("evidenceEmpty",L)+'</p>';
  } else {
    pickedHTML = '<ul class="evidence-picked">'+incState.evidence.map(function(evId){
      var seg = inc.scenario[L].filter(function(s){return s[0]==="e" && s[1]===evId;})[0];
      var text = seg ? seg[2] : evId;
      return '<li>'+ICONS.check+'<span>'+text+'</span><button type="button" class="rm" data-action="toggle-evidence" data-ev="'+evId+'" data-inc="'+inc.id+'" aria-label="remove">'+ICONS.close+'</button></li>';
    }).join("")+'</ul>';

function playRevealSequence(){
  var delays = reduceMotion ? [0,0,0,0] : [400,750,1100,1700];
  var grid = document.getElementById("reveal-grid");
  if(!grid) return;
  var cards = grid.querySelectorAll(".morph-card");
  cards.forEach(function(card, i){
    setTimeout(function(){ card.classList.add("flipped"); }, reduceMotion ? 0 : (300 + i*350));
  });
  setTimeout(function(){
    var sub = document.getElementById("reveal-sub");
    if(sub) sub.classList.add("show");
  }, reduceMotion ? 0 : 1500);
  setTimeout(function(){
    var q = document.getElementById("reveal-quote");
    if(q) q.classList.add("show");
  }, reduceMotion ? 0 : 2000);
  setTimeout(function(){
    var cta = document.getElementById("reveal-cta");
    if(cta) cta.classList.add("show");
  }, reduceMotion ? 0 : 2500);
}

/* ======================================================================
   REVIEW VIEW
   ====================================================================== */
function renderReview(){
  var L = state.lang;
  var cards = INCIDENTS.map(function(inc){
    var incState = state.incidents[inc.id];
    var lensId = incState.primary;
    var editing = incState.reviewEditing;
    var statusHTML = "";
    if(incState.reviewDecision === "kept"){
      statusHTML = '<p class="review-status">'+t("keptStatus",L)+'</p>';
    } else if(incState.reviewDecision === "changed"){
      statusHTML = '<p class="review-status">'+t("changedStatus",L)+'</p>';
    }

    var actionsHTML = editing ? "" : ''+
      '<div class="review-actions">'+
        '<button type="button" class="btn btn-ghost" data-action="review-keep" data-inc="'+inc.id+'">'+t("keepIt",L)+'</button>'+
        '<button type="button" class="btn btn-ghost" data-action="review-edit-open" data-inc="'+inc.id+'">'+t("changeIt",L)+'</button>'+
      '</div>';

    var editHTML = "";
    if(editing){
      var scenario = scenarioHTML(inc, L, incState, true);
      var lensCards = LENS_ORDER.map(function(id){
        var checked = incState.primary === id;
        return '<button type="button" class="lens-card" role="radio" aria-checked="'+(checked?"true":"false")+'" data-lens="'+id+'" data-action="review-choose-primary" data-inc="'+inc.id+'" data-lens-id="'+id+'">'+
          lensIconChip(id)+'<span class="lens-label">'+LENS[id].phase2[L]+'</span>'+
          '</button>';
      }).join("");
      var pickedHTML = incState.evidence.length === 0
        ? '<p class="evidence-empty">'+t("evidenceEmpty",L)+'</p>'
        : '<ul class="evidence-picked">'+incState.evidence.map(function(evId){
            var seg = inc.scenario[L].filter(function(s){return s[0]==="e" && s[1]===evId;})[0];
            return '<li>'+ICONS.check+'<span>'+(seg?seg[2]:evId)+'</span><button type="button" class="rm" data-action="toggle-evidence" data-ev="'+evId+'" data-inc="'+inc.id+'" aria-label="remove">'+ICONS.close+'</button></li>';
          }).join("")+'</ul>';
      var err = validation["review_"+inc.id] ? '<p class="validation-msg" role="alert">'+t(validation["review_"+inc.id]==="verdict"?"errChooseVerdict":"errChooseEvidence",L)+'</p>' : "";

      editHTML = ''+
      '<div class="review-edit" data-inc-scope="'+inc.id+'">'+
        '<p class="review-scenario">'+scenario+'</p>'+
        '<div class="lens-grid" role="radiogroup">'+lensCards+'</div>'+
        pickedHTML+
        err+
        '<div class="review-actions">'+
          '<button type="button" class="btn btn-primary" data-action="review-save" data-inc="'+inc.id+'">'+t("saveNewDecision",L)+'</button>'+
          '<button type="button" class="btn btn-ghost" data-action="review-edit-cancel" data-inc="'+inc.id+'">'+t("cancelEdit",L)+'</button>'+
        '</div>'+
      '</div>';
    }

    return ''+
    '<div class="review-card">'+
      '<div class="review-card-top">'+
        '<span class="review-tag">'+inc.tag[L]+'</span>'+
        '<span class="review-lens-chip '+lensId+'">'+LENS[lensId].phase2[L]+'</span>'+
      '</div>'+
      (editing ? "" : '<p class="review-recap">'+scenarioHTML(inc, L, incState, false)+'</p>')+
      statusHTML+
      actionsHTML+
      editHTML+
    '</div>';
  }).join("");

  return ''+
  '<div class="screen-center">'+
    '<div class="screen-card" style="max-width:840px;">'+
      '<h2>'+t("reviewHeading",L)+'</h2>'+
      '<p>'+t("reviewSub",L)+'</p>'+
      '<div class="review-list">'+cards+'</div>'+
    '</div>'+
  '</div>';
}

/* ======================================================================
   MODAL
   ====================================================================== */
function renderModal(){
  if(!modal) return "";
  var L = state.lang;
  if(modal.type === "reset"){
    return ''+
    '<div class="modal-backdrop" data-action="modal-backdrop">'+
      '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">'+
        '<h3 id="modal-title">'+t("resetTitle",L)+'</h3>'+
        '<p>'+t("resetBody",L)+'</p>'+
        '<div class="modal-actions">'+
          '<button type="button" class="btn btn-ghost" data-action="close-modal">'+t("resetCancel",L)+'</button>'+
          '<button type="button" class="btn btn-primary" data-action="confirm-reset">'+t("resetConfirm",L)+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  return "";
}

/* ======================================================================
   MAIN RENDER
   ====================================================================== */
function render(){
  var L = state.lang;
  document.documentElement.lang = L;
  document.documentElement.dir = (L === "ar") ? "rtl" : "ltr";
  document.body.className = (L === "ar") ? "lang-ar" : "lang-en";

  var body = "";
  if(state.view === "home"){ body = renderHome(); }
  else if(state.view === "incident"){ body = renderIncidentView(); }
  else if(state.view === "pause"){ body = renderPause(); }
  else if(state.view === "reveal"){ body = renderReveal(); }
  else if(state.view === "review"){ body = renderReview(); }

  var showHero = (state.view !== "incident");
  var html = renderTopbar() + (showHero ? renderHero() : (renderHero())) + '<main>'+body+'</main>' + renderModal();
  document.getElementById("root").innerHTML = html;

  if(state.view === "reveal"){
    if(!revealPlayed){
      revealPlayed = true;
      playRevealSequence();
    } else {
      var grid = document.getElementById("reveal-grid");
      if(grid){
        grid.querySelectorAll(".morph-card").forEach(function(c){ c.classList.add("flipped"); });
      }
      ["reveal-sub","reveal-quote","reveal-cta"].forEach(function(id){
        var el = document.getElementById(id);
        if(el) el.classList.add("show");
      });
    }
  } else {
    revealPlayed = false;
  }

  var modalEl = document.querySelector(".modal");
  if(modalEl){ modalEl.focus && modalEl.focus(); }
}

/* ======================================================================
   TIMER TICKING (updates bar fill without resetting timer start)
   ====================================================================== */
setInterval(function(){
  if(state.view !== "incident") return;
  var inc = currentIncident();
  var incState = state.incidents[inc.id];
  if(incState.phase !== "think" && incState.phase !== "discuss") return;
  var bar = document.querySelector('[data-timer-for="'+inc.id+'"] .timer-fill');
  if(!bar) return;
  var ratio = timerRemainingRatio(inc.id);
  bar.style.transform = "scaleX("+ratio+")";
  var label = document.querySelector('[data-timer-for="'+inc.id+'"] .timer-label');
  if(label && timerDone(inc.id)){
    label.textContent = t("timerReady", state.lang);
  }
}, 250);

/* ======================================================================
   ACTIONS
   ====================================================================== */
function setLang(lang){
  if(state.lang === lang) return;
  state.lang = lang;
  saveState();
  render();
}

function startPart1(){
  state.view = "incident";
  state.currentIndex = 0;
  saveState();
  render();
}

function gotoIncident(idx){
  var inc = INCIDENTS[idx];
  if(!state.incidents[inc.id].locked && idx !== state.currentIndex) return;
  state.currentIndex = idx;
  state.view = "incident";
  saveState();
  render();
}

function advancePhase(to){
  var inc = currentIncident();
  var incState = state.incidents[inc.id];
  if(to === "evidence" && !incState.primary){
    validation[inc.id] = "verdict";
    render();
    return;
  }
  validation[inc.id] = null;
  incState.phase = to;
  saveState();
  render();
}

function choosePrimary(lensId){
  var inc = currentIncident();
  var incState = state.incidents[inc.id];
  incState.primary = lensId;
  if(incState.secondary === lensId){ incState.secondary = null; }
  validation[inc.id] = null;
  saveState();
  render();
}

function chooseSecondary(lensId){
  var inc = currentIncident();
  var incState = state.incidents[inc.id];
  incState.secondary = (lensId === "none") ? "none" : lensId;
  saveState();
  render();
}

function toggleEvidence(evId, incId){
  var incState = state.incidents[incId];
  if(!incState) return;
  var idx = incState.evidence.indexOf(evId);
  if(idx !== -1){
    incState.evidence.splice(idx,1);
  } else {
    if(incState.evidence.length >= 2) return;
    incState.evidence.push(evId);
  }
  validation[incId] = null;
  validation["review_"+incId] = null;
  saveState();
  render();
}

function lockVerdict(){
  var inc = currentIncident();
  var incState = state.incidents[inc.id];
  if(incState.evidence.length === 0){
    validation[inc.id] = "evidence";
    render();
    return;
  }
  validation[inc.id] = null;
  incState.phase = "locked";
  incState.locked = true;
  saveState();
  render();
}

function nextIncident(){
  state.currentIndex += 1;
  saveState();
  render();
}

function returnToFrontier(){
  var idx = frontierIndex();
  state.currentIndex = Math.min(idx, INCIDENTS.length - 1);
  saveState();
  render();
}

function finishPart1(){
  state.part1Complete = true;
  state.view = "pause";
  saveState();
  render();
}

function openAfterLearning(){
  state.afterLearningUnlocked = true;
  state.view = "reveal";
  saveState();
  render();
}

function gotoReview(){
  state.view = "review";
  saveState();
  render();
}

function reviewKeep(incId){
  state.incidents[incId].reviewDecision = "kept";
  saveState();
  render();
}
function reviewEditOpen(incId){
  state.incidents[incId].reviewEditing = true;
  saveState();
  render();
}
function reviewEditCancel(incId){
  state.incidents[incId].reviewEditing = false;
  saveState();
  render();
}
function reviewChoosePrimary(incId, lensId){
  state.incidents[incId].primary = lensId;
  validation["review_"+incId] = null;
  saveState();
  render();
}
function reviewSave(incId){
  var incState = state.incidents[incId];
  if(incState.evidence.length === 0){
    validation["review_"+incId] = "evidence";
    render();
    return;
  }
  incState.reviewEditing = false;
  incState.reviewDecision = "changed";
  validation["review_"+incId] = null;
  saveState();
  render();
}

function openResetModal(){ modal = {type:"reset"}; render(); }
function closeModal(){ modal = null; render(); }
function confirmReset(){
  try{ storage.remove(STORAGE_KEY); }catch(e){}
  state = freshState();
  timerRuntime = {};
  validation = {};
  modal = null;
  saveState();
  render();
}

/* ======================================================================
   EVENT DELEGATION
   ====================================================================== */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");

  switch(action){
    case "set-lang": setLang(el.getAttribute("data-lang")); break;
    case "start-part1": startPart1(); break;
    case "goto-incident": gotoIncident(parseInt(el.getAttribute("data-idx"),10)); break;
    case "advance-phase": advancePhase(el.getAttribute("data-to")); break;
    case "choose-primary": choosePrimary(el.getAttribute("data-lens-id")); break;
    case "choose-secondary": chooseSecondary(el.getAttribute("data-lens-id")); break;
    case "toggle-evidence": toggleEvidence(el.getAttribute("data-ev"), el.getAttribute("data-inc")); break;
    case "lock-verdict": lockVerdict(); break;
    case "next-incident": nextIncident(); break;
    case "return-to-frontier": returnToFrontier(); break;
    case "finish-part1": finishPart1(); break;
    case "open-afterlearning": openAfterLearning(); break;
    case "goto-review": gotoReview(); break;
    case "review-keep": reviewKeep(el.getAttribute("data-inc")); break;
    case "review-edit-open": reviewEditOpen(el.getAttribute("data-inc")); break;
    case "review-edit-cancel": reviewEditCancel(el.getAttribute("data-inc")); break;
    case "review-choose-primary": reviewChoosePrimary(el.getAttribute("data-inc"), el.getAttribute("data-lens-id")); break;
    case "review-save": reviewSave(el.getAttribute("data-inc")); break;
    case "open-reset": openResetModal(); break;
    case "close-modal": closeModal(); break;
    case "confirm-reset": confirmReset(); break;
    case "modal-backdrop": if(e.target === el){ closeModal(); } break;
  }
});

/* Keyboard support for radiogroups (lens cards / secondary chips) */
document.addEventListener("keydown", function(e){
  if(e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  var active = document.activeElement;
  if(!active || active.getAttribute("role") !== "radio") return;
  var group = active.closest('[role="radiogroup"]');
  if(!group) return;
  var radios = Array.prototype.slice.call(group.querySelectorAll('[role="radio"]'));
  var idx = radios.indexOf(active);
  if(idx === -1) return;
  var dir = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
  if(document.documentElement.dir === "rtl" && (e.key === "ArrowRight" || e.key === "ArrowLeft")){ dir *= -1; }
  var nextIdx = (idx + dir + radios.length) % radios.length;
  radios[nextIdx].focus();
  e.preventDefault();
});

/* Escape closes modal; Tab is trapped inside it while open */
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && modal){ closeModal(); return; }
  if(e.key === "Tab" && modal){
    var modalEl = document.querySelector(".modal");
    if(!modalEl) return;
    var focusables = Array.prototype.slice.call(modalEl.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])"));
    if(focusables.length === 0) return;
    var first = focusables[0], last = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement === first){
      last.focus(); e.preventDefault();
    } else if(!e.shiftKey && document.activeElement === last){
      first.focus(); e.preventDefault();
    }
  }
});

/* ======================================================================
   INIT
   ====================================================================== */
render();

})();
</script>
